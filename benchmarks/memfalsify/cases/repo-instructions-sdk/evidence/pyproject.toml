[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quayside"
version = "2.1.0"
description = "Python SDK for the Quayside shipment-tracking API"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]

[project.scripts]
quayside = "quayside.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: calls the Quayside sandbox API (needs QUAYSIDE_SANDBOX_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["quayside"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["quayside"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
