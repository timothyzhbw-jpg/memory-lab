[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "fernhook"
dynamic = ["version"]
description = "Sync a folder of Markdown notes with a Fernwiki space"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
fernhook = "fernhook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-recording>=0.13",
    "syrupy>=4.6",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --record-mode=none"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
