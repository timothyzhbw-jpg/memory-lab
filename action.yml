name: MemFalsify
description: Audit agent instruction files (CLAUDE.md, AGENTS.md) against the repository's own docs and configs.
author: timothyzhbw-jpg
branding:
  icon: check-circle
  color: blue

inputs:
  memory:
    description: >-
      Memory files to audit, separated by spaces or newlines; quote a path that contains spaces
      (shell-style, e.g. CLAUDE.md "docs/agent notes.md"). Files that do not exist are skipped;
      if none exists the action emits a notice and succeeds. Markdown links are not followed;
      list additional instruction files explicitly. Use forward slashes in paths on every runner.
    required: false
    default: CLAUDE.md AGENTS.md
  evidence:
    description: Evidence directory, relative to the workspace.
    required: false
    default: "."
  exclude:
    description: >-
      Globs to leave out of the evidence, one per line, matched (fnmatch) against paths relative to the
      evidence directory; "dir/**" and "dir/*" exclude everything under dir.
    required: false
    default: ""
  strict:
    description: Fail when any memory is challenged, conflicted, disputed or has possible counterevidence.
    required: false
    default: "true"
  verifier:
    description: >-
      lexical (offline, default), llm (Claude; needs ANTHROPIC_API_KEY), jev (TypeSafe Jev; needs
      TYPESAFE_API_KEY), dual or cascade (both keys). Model verifiers send memory text and evidence
      passages to the provider.
    required: false
    default: lexical
  diff-base:
    description: >-
      Base revision for a diff-only check, for example github.event.pull_request.base.sha. When set, only
      claims added or changed since this revision are audited, so a pull request is gated on the claims it
      touches. Needs that commit in the checkout: use actions/checkout with fetch-depth: 0. Empty audits
      every claim.
    required: false
    default: ""
  as-of:
    description: Reference date YYYY-MM-DD for staleness checks; empty means today.
    required: false
    default: ""
  python-version:
    description: Python used for an isolated MemFalsify install (the job's own Python is not changed).
    required: false
    default: "3.12"

outputs:
  report:
    description: Path of the Markdown report (also written to the job summary).
    value: ${{ steps.audit.outputs.report }}
  attention:
    description: >-
      Number of memories (with diff-base, of added or changed memories) that are challenged, conflicted,
      disputed or have possible counterevidence.
    value: ${{ steps.audit.outputs.attention }}

runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false

    - id: install
      shell: bash
      env:
        MEMFALSIFY_VERIFIER: ${{ inputs.verifier }}
        SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        set -euo pipefail
        # One hash-pinned lock file per dependency set (action/requirements/*.txt; see docs/github-action.md).
        case "$MEMFALSIFY_VERIFIER" in
          lexical|llm|jev) lock="$MEMFALSIFY_VERIFIER" ;;
          dual|cascade) lock="all" ;;
          *) echo "::error title=MemFalsify::the verifier input must be lexical, llm, jev, dual or cascade"; exit 2 ;;
        esac
        # Build from a copy: pip writes build/ and *.egg-info into the source tree, which is the
        # audited workspace when the action runs from the checkout (uses: ./).
        src="$RUNNER_TEMP/memfalsify-src"
        venv="$RUNNER_TEMP/memfalsify-venv"
        rm -rf "$src" "$venv"
        mkdir -p "$src"
        cp -R "$GITHUB_ACTION_PATH/packages/memcore" "$GITHUB_ACTION_PATH/packages/memfalsify" "$src/"
        "$SETUP_PYTHON" -m venv "$venv"
        if [ -x "$venv/bin/python" ]; then py="$venv/bin/python"; else py="$venv/Scripts/python.exe"; fi
        # Third-party packages come only from the vendored lock file: exact versions, every file hashed,
        # wheels only (building an sdist would fetch its build backend unpinned).
        "$py" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary :all: \
          -r "$GITHUB_ACTION_PATH/action/requirements/$lock.txt"
        # The action's own packages come from the action path. --no-deps stops pip from resolving anything
        # else; --no-build-isolation builds with the locked setuptools instead of fetching one.
        "$py" -m pip install --quiet --disable-pip-version-check --no-deps --no-build-isolation \
          "$src/memcore" "$src/memfalsify"
        "$py" -m pip check --disable-pip-version-check
        echo "python=$py" >> "$GITHUB_OUTPUT"

    - id: audit
      shell: bash
      env:
        MEMFALSIFY_PYTHON: ${{ steps.install.outputs.python }}
        MEMFALSIFY_MEMORY: ${{ inputs.memory }}
        MEMFALSIFY_EVIDENCE: ${{ inputs.evidence }}
        MEMFALSIFY_EXCLUDE: ${{ inputs.exclude }}
        MEMFALSIFY_STRICT: ${{ inputs.strict }}
        MEMFALSIFY_VERIFIER: ${{ inputs.verifier }}
        MEMFALSIFY_AS_OF: ${{ inputs.as-of }}
        MEMFALSIFY_DIFF_BASE: ${{ inputs.diff-base }}
      run: '"$MEMFALSIFY_PYTHON" -I -X utf8 "$GITHUB_ACTION_PATH/action/memfalsify_action.py"'
