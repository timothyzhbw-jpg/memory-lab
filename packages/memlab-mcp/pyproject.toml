[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memlab-mcp"
version = "0.5.0"
description = "Read-only Model Context Protocol server for MemFalsify and Verified Organizational Memory"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["mcp", "model-context-protocol", "agent-memory", "ai-agents", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "memlab-core>=0.4,<0.5",
    "memfalsify>=0.5,<0.6",
    "orgmemory>=0.4,<0.5",
    "mcp>=2.2,<3",
    "pydantic>=2.12",
    "typer>=0.17.5",
]

[project.urls]
Homepage = "https://github.com/timothyzhbw-jpg/memory-lab"
Documentation = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/docs/mcp.md"
Repository = "https://github.com/timothyzhbw-jpg/memory-lab"
Issues = "https://github.com/timothyzhbw-jpg/memory-lab/issues"
Changelog = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
models = ["memfalsify[llm,jev,openai]"]

[project.scripts]
memlab-mcp = "memlab_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memlab_mcp = ["py.typed"]
