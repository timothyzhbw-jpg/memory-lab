[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memlab-core"
version = "0.1.0"
description = "Shared evidence integrity primitives for MemFalsify and Verified Organizational Memory"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pydantic>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]
