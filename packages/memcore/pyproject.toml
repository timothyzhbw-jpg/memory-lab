[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memlab-core"
version = "0.4.0"
description = "Shared evidence integrity primitives for MemFalsify and Verified Organizational Memory"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["evidence", "provenance", "sha256", "jsonl", "agent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.12"]

[project.urls]
Homepage = "https://github.com/timothyzhbw-jpg/memory-lab"
Documentation = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/docs/api.md"
Repository = "https://github.com/timothyzhbw-jpg/memory-lab"
Issues = "https://github.com/timothyzhbw-jpg/memory-lab/issues"
Changelog = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memcore = ["py.typed"]
