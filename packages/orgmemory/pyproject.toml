[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmemory"
version = "0.4.0"
description = "Verified Organizational Memory: replay decisions under explicit authority rules with traceable evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["memlab-core>=0.3,<0.4", "pydantic>=2.5", "typer>=0.12"]

[project.urls]
Homepage = "https://github.com/timothyzhbw-jpg/memory-lab"
Changelog = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/CHANGELOG.md"

[project.scripts]
orgmemory = "orgmemory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orgmemory = ["py.typed"]
