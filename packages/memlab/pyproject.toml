# A meta-distribution: it installs the packages below and holds no modules of its own. Its version names the
# release, and publish.yml's confirm input must match it (docs/publishing.md).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memlab"
version = "0.5.0"
description = "Installs MemFalsify and orgmemory together: audit agent memory against evidence, replay team decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["agent-memory", "ai-agents", "claude-md", "agents-md", "evidence", "audit", "decision-log"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["memfalsify>=0.5,<0.6", "orgmemory>=0.4.1,<0.5"]

[project.urls]
Homepage = "https://github.com/timothyzhbw-jpg/memory-lab"
Documentation = "https://github.com/timothyzhbw-jpg/memory-lab/tree/main/docs"
Repository = "https://github.com/timothyzhbw-jpg/memory-lab"
Issues = "https://github.com/timothyzhbw-jpg/memory-lab/issues"
Changelog = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ui = ["memlab-ui>=0.1,<0.2"]
mcp = ["memlab-mcp>=0.5,<0.6"]
llm = ["memfalsify[llm]>=0.5,<0.6"]
jev = ["memfalsify[jev]>=0.5,<0.6"]
openai = ["memfalsify[openai]>=0.5,<0.6"]
all = ["memfalsify[all]>=0.5,<0.6"]

[tool.setuptools]
packages = []
