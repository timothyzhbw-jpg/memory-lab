[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memlab-ui"
version = "0.1.0"
description = "Local, read-only web page for trying MemFalsify and Verified Organizational Memory"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["agent-memory", "ai-agents", "decision-log", "evidence", "local-web-ui", "read-only"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "memlab-core>=0.4,<0.5",
    "memfalsify>=0.5,<0.6",
    "orgmemory>=0.4.1,<0.5",
    "pydantic>=2.12",
    "typer>=0.17.5",
]

[project.urls]
Homepage = "https://github.com/timothyzhbw-jpg/memory-lab"
Documentation = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/docs/ui.md"
Repository = "https://github.com/timothyzhbw-jpg/memory-lab"
Issues = "https://github.com/timothyzhbw-jpg/memory-lab/issues"
Changelog = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
models = ["memfalsify[llm,jev]"]

[project.scripts]
memlab-ui = "memlab_ui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memlab_ui = ["py.typed", "static/*.png"]
