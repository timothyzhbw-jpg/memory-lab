[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memlab-ui"
version = "0.1.0"
description = "Local, read-only web page for trying MemFalsify and Verified Organizational Memory"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "memlab-core>=0.4,<0.5",
    "memfalsify>=0.4.1,<0.5",
    "orgmemory>=0.4.1,<0.5",
    "pydantic>=2.12",
    "typer>=0.17.5",
]

[project.urls]
Homepage = "https://github.com/timothyzhbw-jpg/memory-lab"
Changelog = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
models = ["memfalsify[llm,jev]"]

[project.scripts]
memlab-ui = "memlab_ui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memlab_ui = ["py.typed", "static/*.png"]
