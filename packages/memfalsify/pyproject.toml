[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memfalsify"
version = "0.5.0"
description = "Audit agent memory against traceable evidence; challenge claims, never rewrite them"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["agent-memory", "ai-agents", "claude-md", "agents-md", "cursor-rules", "evidence", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["memlab-core>=0.4,<0.5", "pydantic>=2.12", "typer>=0.17.5"]

[project.urls]
Homepage = "https://github.com/timothyzhbw-jpg/memory-lab"
Documentation = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/docs/tutorial.md"
Repository = "https://github.com/timothyzhbw-jpg/memory-lab"
Issues = "https://github.com/timothyzhbw-jpg/memory-lab/issues"
Changelog = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = ["anthropic>=1.13"]
jev = ["typesafe-sdk>=0.7"]
openai = ["openai>=3.0"]
all = ["memfalsify[llm,jev,openai]"]

[project.scripts]
memfalsify = "memfalsify.cli:main"
memfalsify-pre-commit = "memfalsify.precommit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memfalsify = ["py.typed"]
