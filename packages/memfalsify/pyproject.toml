[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memfalsify"
version = "0.3.0"
description = "Audit agent memory against traceable evidence; challenge claims, never rewrite them"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["memlab-core>=0.2,<0.3", "pydantic>=2.5", "typer>=0.12"]

[project.urls]
Homepage = "https://github.com/timothyzhbw-jpg/memory-lab"
Changelog = "https://github.com/timothyzhbw-jpg/memory-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = ["anthropic>=1.13"]
jev = ["typesafe-sdk>=0.7"]
all = ["memfalsify[llm,jev]"]

[project.scripts]
memfalsify = "memfalsify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memfalsify = ["py.typed"]
