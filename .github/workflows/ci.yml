name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e packages/memcore -e "packages/memfalsify[all]" -e packages/orgmemory -e packages/memlab-mcp -e packages/memlab-ui pytest cmarkgfm "tomli; python_version < '3.11'"
      - name: Test
        run: python -m pytest -q

  lowest:
    # The declared lower bounds must hold: every direct dependency at its lowest allowed version, transitive
    # ones at their newest (uv's lowest-direct resolution), on the oldest supported Python.
    name: lowest direct dependencies (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install with --resolution lowest-direct
        run: >-
          uv pip install --system --resolution lowest-direct
          -e packages/memcore -e "packages/memfalsify[all]" -e packages/orgmemory -e packages/memlab-mcp -e packages/memlab-ui
          "pytest>=8" "tomli; python_version < '3.11'"
      - name: Show the resolved versions
        run: uv pip freeze --system
      - name: Test
        run: python -m pytest -q

  # `uses: ./` runs the action from the checked-out ref, so a pull request exercises its own copy of
  # action.yml and its lock files. That is safe only while this job holds nothing worth stealing: a
  # read-only token that is not persisted, no secrets, and the offline lexical verifier. Do not add a
  # secret, a write permission or `pull_request_target` here (tests/test_action.py checks), and see
  # "Why the dogfood job is safe" in docs/github-action.md.
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Audit AGENTS.md against this repository
        uses: ./
        with:
          memory: AGENTS.md
          evidence: .
          exclude: |
            benchmarks/**
            examples/**
            tests/fixtures/**
            .worktrees/**
          strict: "true"
