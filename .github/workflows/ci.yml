name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e packages/memcore -e "packages/memfalsify[all]" -e packages/orgmemory -e packages/memlab-mcp pytest
      - name: Test
        run: python -m pytest -q

  lowest:
    # The declared lower bounds must hold: every direct dependency at its lowest allowed version, transitive
    # ones at their newest (uv's lowest-direct resolution), on the oldest supported Python.
    name: lowest direct dependencies (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install with --resolution lowest-direct
        run: >-
          uv pip install --system --resolution lowest-direct
          -e packages/memcore -e "packages/memfalsify[all]" -e packages/orgmemory -e packages/memlab-mcp
          "pytest>=8"
      - name: Show the resolved versions
        run: uv pip freeze --system
      - name: Test
        run: python -m pytest -q

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit AGENTS.md against this repository
        uses: ./
        with:
          memory: AGENTS.md
          evidence: .
          exclude: |
            benchmarks/**
            examples/**
            tests/fixtures/**
            .worktrees/**
          strict: "true"
