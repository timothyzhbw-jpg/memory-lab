name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e packages/memcore -e packages/memfalsify -e packages/orgmemory pytest
      - name: Test
        run: python -m pytest -q

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit CLAUDE.md against this repository
        uses: ./
        with:
          memory: CLAUDE.md
          evidence: .
          exclude: |
            benchmarks/**
            examples/**
            tests/fixtures/**
            .worktrees/**
          strict: "true"
