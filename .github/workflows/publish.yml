name: Publish to PyPI

# Manual only: nothing in this repository starts this workflow, and it holds no key or password. A person presses
# "Run workflow" and types the version. PyPI accepts the uploads through Trusted Publishing, which trusts this file
# name in this repository with the job's environment. Setup and use: docs/publishing.md.
# tests/test_publish_workflow.py keeps the triggers, permissions, pins and upload order below as they are.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the version in packages/memlab/pyproject.toml, for example 0.5.0. Any other value stops the run before an upload."
        required: true
        type: string
      target:
        description: "build-only uploads nothing. testpypi is the dry run. pypi is the real upload and works from main only."
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - testpypi
          - pypi
      stop-after:
        description: "Upload in dependency order and stop after this package. The first publication goes one package per run: see docs/publishing.md."
        required: true
        type: choice
        default: memlab
        options:
          - memlab
          - memlab-ui
          - memlab-mcp
          - orgmemory
          - memfalsify
          - memlab-core

# A second press waits for the first to finish, so two runs never upload at once.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check every package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse a real upload from anything but main
        if: inputs.target == 'pypi' && github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Publish::target pypi works from main only"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the hash-locked build tools
        run: |
          python -m pip install --require-hashes --only-binary :all: -r scripts/publish-requirements.txt
      - name: Build every sdist and wheel
        run: python scripts/dists.py build dist
      - name: Check how the READMEs render
        run: python -m twine check --strict dist/*/*
      - name: Compare the built files with the confirm input
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: python scripts/dists.py check dist --confirm="$CONFIRM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dists
          path: dist/
          if-no-files-found: error

  # The two upload jobs run nothing from the repository: only the files the build job checked reach the job that can
  # mint an upload token. A file whose version is already on the index is skipped, never replaced, so a run can be
  # repeated after a partial failure and a release can leave a package's version unchanged.
  publish:
    name: Upload to PyPI
    needs: build
    if: inputs.target == 'pypi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # what Trusted Publishing exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dists
          path: dist
      - name: memlab-core
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/memlab-core
          skip-existing: true
      - name: memfalsify
        if: inputs.stop-after != 'memlab-core'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/memfalsify
          skip-existing: true
      - name: orgmemory
        if: inputs.stop-after != 'memlab-core' && inputs.stop-after != 'memfalsify'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/orgmemory
          skip-existing: true
      - name: memlab-mcp
        if: inputs.stop-after == 'memlab-mcp' || inputs.stop-after == 'memlab-ui' || inputs.stop-after == 'memlab'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/memlab-mcp
          skip-existing: true
      - name: memlab-ui
        if: inputs.stop-after == 'memlab-ui' || inputs.stop-after == 'memlab'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/memlab-ui
          skip-existing: true
      - name: memlab
        if: inputs.stop-after == 'memlab'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/memlab
          skip-existing: true

  dry-run:
    name: Upload to TestPyPI
    needs: build
    if: inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # what Trusted Publishing exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dists
          path: dist
      - name: memlab-core
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/memlab-core
          skip-existing: true
      - name: memfalsify
        if: inputs.stop-after != 'memlab-core'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/memfalsify
          skip-existing: true
      - name: orgmemory
        if: inputs.stop-after != 'memlab-core' && inputs.stop-after != 'memfalsify'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/orgmemory
          skip-existing: true
      - name: memlab-mcp
        if: inputs.stop-after == 'memlab-mcp' || inputs.stop-after == 'memlab-ui' || inputs.stop-after == 'memlab'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/memlab-mcp
          skip-existing: true
      - name: memlab-ui
        if: inputs.stop-after == 'memlab-ui' || inputs.stop-after == 'memlab'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/memlab-ui
          skip-existing: true
      - name: memlab
        if: inputs.stop-after == 'memlab'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/memlab
          skip-existing: true
